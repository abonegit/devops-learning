
name: Application CI

on:
  push:
    paths:
      - "cicd/task-1/**"
      - ".github/workflows/application-ci.yml"
  pull_request:
    paths:
      - "cicd/task-1/**"
      - ".github/workflows/application-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linter
        run: python -m pip install ruff

      - name: Lint Python
        run: ruff check cicd/task-1/

      - name: Run unit tests
        run: python -m unittest discover -s cicd/task-1 -p "test_*.py"

      - name: Build Docker image
        run: docker build -t hello-app:test ./cicd/task-1
